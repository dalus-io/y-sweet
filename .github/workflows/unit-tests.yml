name: Unit Tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/**"
      - ".github/workflows/unit-tests.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./crates

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: |
            crates
            crates/y-sweet-worker
      - name: Run unit tests
        run: cargo test --verbose
      # The worker is excluded from the workspace, so `cargo test` above never compiles it.
      # It builds y-sweet-core without the `sync` feature, for wasm32 (see its .cargo/config).
      - name: Check y-sweet-worker
        working-directory: ./crates/y-sweet-worker
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check
